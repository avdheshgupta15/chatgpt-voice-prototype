<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Edit Message</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style data-purpose="keyboard-styles">
    /* iOS Key elevation and subtle shadow */
    .ios-key {
      background-color: #636366;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      border-radius: 5px;
      user-select: none;
      transition: background-color 0.1s ease;
    }
    .ios-key:active {
      background-color: #8e8e93;
    }
    .ios-key-special {
      background-color: #424244;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      border-radius: 5px;
      user-select: none;
    }
    .ios-key-special:active {
      background-color: #636366;
    }
    /* Blinking iOS Cursor */
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .ios-cursor {
      display: inline-block;
      width: 2.5px;
      height: 1.25em;
      background-color: #3b82f6;
      vertical-align: text-bottom;
      animation: cursor-blink 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      margin-left: 1px;
    }
  </style>
</head>
<body class="bg-black text-white flex justify-center min-h-screen select-none overflow-x-hidden">
<!-- BEGIN: MobileFrameContainer -->
<div class="w-full max-w-[428px] h-screen bg-black flex flex-col justify-between overflow-hidden relative" data-purpose="app-viewport">
<!-- BEGIN: TopContainer -->
<div class="flex flex-col flex-grow justify-between">
<!-- BEGIN: StatusBarAndNav -->
<div class="w-full pt-3 px-7">
<!-- iOS Status Bar -->
<div class="flex justify-between items-center text-white h-6 text-sm font-semibold tracking-tight" data-purpose="status-bar">
<span class="text-[15px] font-medium tracking-tight">11:24</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal -->
<div class="flex items-end space-x-[2px] h-3">
<div class="w-[3px] h-[4px] bg-white rounded-xs"></div>
<div class="w-[3px] h-[6px] bg-white rounded-xs"></div>
<div class="w-[3px] h-[8px] bg-white rounded-xs"></div>
<div class="w-[3px] h-[10px] bg-white/40 rounded-xs"></div>
</div>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9.45 2.02-12.7 5.28l1.41 1.41C3.39 7.02 7.42 5.2 12 5.2s8.61 1.82 11.29 4.49l1.41-1.41C21.45 5.02 16.97 3 12 3zm0 4.8c-3.66 0-6.95 1.5-9.34 3.9l1.41 1.41C5.81 11.37 8.71 10.2 12 10.2s6.19 1.17 7.93 2.91l1.41-1.41C18.95 9.3 15.66 7.8 12 7.8zm0 4.8c-2.35 0-4.46.97-6 2.53l6 6.37 6-6.37c-1.54-1.56-3.65-2.53-6-2.53z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-[11px] border border-white rounded-[4px] p-[1px] flex items-center relative ml-0.5">
<div class="h-full bg-white rounded-[2px] w-full"></div>
<div class="w-[2px] h-[4px] bg-white absolute -right-[3px] rounded-r-xs"></div>
</div>
</div>
</div>
<!-- Navigation Header -->
<header class="flex items-center justify-between mt-3 py-2 relative" data-purpose="header">
<!-- Close Button -->
<button aria-label="Close" class="w-10 h-10 rounded-full bg-[#202123] flex items-center justify-center text-white active:bg-neutral-800 transition" type="button">
<svg class="w-5 h-5 text-gray-200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
<!-- Title -->
<h1 class="text-base font-semibold text-white absolute left-1/2 -translate-x-1/2">Edit message</h1>
<div class="w-10"></div> <!-- Spacer for optical centering -->
</header>
</div>
<!-- END: StatusBarAndNav -->
<!-- Empty flexible space to push input container to bottom above keyboard -->
<div class="flex-grow"></div>
<!-- BEGIN: EditableMessageCard -->
<div class="px-3 pb-3" data-purpose="edit-message-card">
<div class="bg-[#202123] rounded-3xl p-4 flex flex-col justify-between min-h-[145px] shadow-lg border border-white/5">
<!-- User Prompt Text with Blinking Blue Cursor -->
<div class="text-white text-[16px] leading-[1.38] font-normal tracking-tight outline-none" data-purpose="editable-text-area">
            What's a quick way to remember Manga five forces before my strategy exam<span class="ios-cursor"></span>
</div>
<!-- Input Action Bar -->
<div class="flex items-center justify-between mt-3.5 pt-1">
<!-- Left Action: Plus Icon -->
<button aria-label="Add content" class="text-white p-1 rounded-full hover:bg-white/10 active:scale-95 transition" type="button">
<svg class="w-7 h-7 text-white stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
<!-- Right Actions: Dictation & Submit Button -->
<div class="flex items-center space-x-3.5">
<!-- Voice Microphone -->
<button aria-label="Dictate" class="text-white p-1 hover:bg-white/10 active:scale-95 transition" type="button">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="22"></line>
</svg>
</button>
<!-- Blue Send / Submit Button -->
<button aria-label="Send" class="w-8 h-8 rounded-full bg-[#007AFF] flex items-center justify-center text-white active:bg-blue-600 transition shadow" type="button">
<svg class="w-4 h-4 text-white stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 19.5v-15m0 0l-5.5 5.5m5.5-5.5l5.5 5.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</div>
</div>
<!-- END: EditableMessageCard -->
</div>
<!-- END: TopContainer -->
<!-- BEGIN: IOSKeyboard -->
<footer class="bg-[#1c1c1e] select-none pt-1 pb-2 flex flex-col justify-end" data-purpose="ios-keyboard">
<!-- Keyboard Predictive Text Bar -->
<div class="flex items-center justify-between text-[15px] text-gray-200 px-3 py-2 border-b border-black/30 h-11" data-purpose="predictive-text-bar">
<!-- Previous / Expand Chevron -->
<div class="w-7 flex items-center justify-center text-gray-400">
<svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<polyline points="6 9 12 15 18 9"></polyline>
</svg>
</div>
<div class="h-5 w-[1px] bg-neutral-700/60"></div>
<!-- Suggestions -->
<span class="px-2 font-medium tracking-tight text-white flex-1 text-center">“exam”</span>
<div class="h-5 w-[1px] bg-neutral-700/60"></div>
<span class="px-2 font-normal text-gray-300 flex-1 text-center">example</span>
<div class="h-5 w-[1px] bg-neutral-700/60"></div>
<span class="px-2 font-normal text-gray-300 flex-1 text-center">examination</span>
<div class="h-5 w-[1px] bg-neutral-700/60"></div>
<!-- Action / Translate icon placeholder button -->
<div class="w-7 flex items-center justify-center">
<div class="w-5 h-5 bg-[#3a3a3c] rounded text-[11px] font-semibold flex items-center justify-center text-gray-300 border border-neutral-600">
            A
          </div>
</div>
</div>
<!-- Keys Container -->
<div class="p-1 space-y-2 text-[22px] font-normal leading-none" data-purpose="keyboard-keys">
<!-- Row 1: q w e r t y u i o p -->
<div class="flex justify-between space-x-1.5 px-0.5">
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">q</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">w</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">e</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">r</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">t</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">y</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">u</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">i</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">o</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">p</button>
</div>
<!-- Row 2: a s d f g h j k l -->
<div class="flex justify-center space-x-1.5 px-4">
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">a</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">s</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">d</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">f</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">g</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">h</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">j</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">k</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">l</button>
</div>
<!-- Row 3: Shift, z x c v b n m, Backspace -->
<div class="flex justify-between space-x-1.5 px-0.5">
<!-- Shift Key -->
<button aria-label="Shift" class="ios-key-special w-[42px] h-[42px] flex items-center justify-center text-white">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 4.5l-6.75 6.75h3.75v8.25h6v-8.25h3.75L12 4.5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">z</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">x</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">c</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">v</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">b</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">n</button>
<button class="ios-key flex-1 h-[42px] flex items-center justify-center">m</button>
<!-- Backspace / Delete Key -->
<button aria-label="Delete" class="ios-key-special w-[42px] h-[42px] flex items-center justify-center text-white">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
<line x1="18" x2="12" y1="9" y2="15"></line>
<line x1="12" x2="18" y1="9" y2="15"></line>
</svg>
</button>
</div>
<!-- Row 4: 123, Spacebar (EN GU), Return -->
<div class="flex justify-between space-x-1.5 px-0.5 pt-0.5">
<!-- 123 Numeric Toggle Key -->
<button class="ios-key-special w-[86px] h-[42px] flex items-center justify-center text-[15px] font-normal tracking-normal text-white">
            123
          </button>
<!-- Spacebar Key with locale -->
<button aria-label="Space" class="ios-key flex-grow h-[42px] flex flex-col items-center justify-end pb-1 relative">
<span class="text-[10px] text-gray-300/80 font-medium tracking-wider">EN GU</span>
</button>
<!-- Return Key -->
<button aria-label="Return" class="ios-key-special w-[86px] h-[42px] flex items-center justify-center text-white">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 016 6v3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Bottom Bar: Emoji & Mic Buttons with Home Indicator -->
<div class="flex justify-between items-center px-4 pt-3 pb-1" data-purpose="keyboard-bottom-accessories">
<!-- Emoji Button -->
<button aria-label="Emoji" class="text-gray-400 active:text-white transition p-1" type="button">
<svg class="w-7 h-7 stroke-[1.8]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
<line stroke-width="2.5" x1="9" x2="9.01" y1="9" y2="9"></line>
<line stroke-width="2.5" x1="15" x2="15.01" y1="9" y2="9"></line>
</svg>
</button>
<!-- Dictation Mic Button -->
<button aria-label="Keyboard Dictation" class="text-gray-400 active:text-white transition p-1" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="23"></line>
</svg>
</button>
</div>
<!-- iOS Home Indicator -->
<div class="flex justify-center w-full pt-1 pb-1" data-purpose="ios-home-indicator">
<div class="w-36 h-1 bg-white/70 rounded-full"></div>
</div>
</footer>
<!-- END: IOSKeyboard -->
</div>
<!-- END: MobileFrameContainer -->




</body></html>
