<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>ChatGPT Mobile Interface</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appDark: '#000000',
            panelDark: '#1e1e1e',
            pillDark: '#1b1b1b',
            borderDark: '#2a2a2a',
            accentBlue: '#3b82f6',
            chatgptBlue: '#2297ff',
            textGrey: '#737373',
            promptText: '#e5e5e5'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Prevent rubber banding and setup full iOS viewport height */
    body {
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      background-color: #000000;
    }
    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-black text-white font-sans flex flex-col justify-between h-screen w-screen overflow-hidden select-none">
<!-- BEGIN: TopContainer -->
<div class="w-full flex flex-col pt-3 px-6 shrink-0 z-10" data-purpose="top-navigation-wrapper">
<!-- BEGIN: StatusBar -->
<!-- Mimics iOS 16/17 dynamic island / status bar notch spacing -->
<div class="w-full flex items-center justify-between text-white text-[15px] font-semibold tracking-tight pb-3 select-none" data-purpose="ios-status-bar">
<!-- Time -->
<span class="pl-2 font-semibold">7:02</span>
<!-- Status Icons -->
<div class="flex items-center space-x-1.5 pr-1">
<!-- Cellular Bars -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<rect height="6" opacity="0.35" rx="0.8" width="2.8" x="2" y="15"></rect>
<rect height="9" rx="0.8" width="2.8" x="6.8" y="12"></rect>
<rect height="13" rx="0.8" width="2.8" x="11.6" y="8"></rect>
<rect height="17" rx="0.8" width="2.8" x="16.4" y="4"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path>
</svg>
<!-- Battery Indicator -->
<div class="w-[22px] h-[11.5px] border border-white/80 rounded-[4px] p-[1.5px] flex items-center relative ml-0.5">
<div class="h-full bg-white rounded-[1.5px] w-full"></div>
<div class="absolute -right-[3px] top-[2.5px] w-[2px] h-[4px] bg-white/80 rounded-r-[1px]"></div>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: HeaderNav -->
<header class="w-full flex items-center justify-between pt-1" data-purpose="app-header-controls">
<div class="flex items-center space-x-2.5">
<!-- Menu Button (Two horizontal lines) -->
<button aria-label="Open sidebar" class="w-11 h-11 rounded-full bg-[#1b1b1b] active:bg-[#2c2c2c] transition-colors flex items-center justify-center" type="button">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<line x1="4" x2="20" y1="9" y2="9"></line>
<line x1="4" x2="20" y1="15" y2="15"></line>
</svg>
</button>
<!-- Upgrade Pill Button -->
<button aria-label="Upgrade plan" class="h-11 px-4 rounded-full bg-[#1b1b1b] active:bg-[#2c2c2c] transition-colors flex items-center space-x-2" type="button">
<!-- Sparkle Diamond Icon -->
<svg class="w-4 h-4 text-[#3894ff] fill-[#3894ff]" viewBox="0 0 24 24">
<path d="M12 0L14.7 9.3L24 12L14.7 14.7L12 24L9.3 14.7L0 12L9.3 9.3L12 0Z"></path>
</svg>
<span class="text-[#3894ff] text-base font-medium tracking-tight">Upgrade</span>
</button>
</div>
<!-- New Chat / History Button -->
<button aria-label="New chat" class="w-11 h-11 rounded-full bg-[#1b1b1b] active:bg-[#2c2c2c] transition-colors flex items-center justify-center" type="button">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
</svg>
</button>
</header>
<!-- END: HeaderNav -->
</div>
<!-- END: TopContainer -->
<!-- BEGIN: MainContentCanvas -->
<!-- Spacer canvas area reflecting the clean vertical negative space -->
<main class="flex-1 w-full" data-purpose="chat-canvas"></main>
<!-- END: MainContentCanvas -->
<!-- BEGIN: BottomSuggestionsAndInput -->
<div class="w-full px-5 pb-7 flex flex-col space-y-6" data-purpose="interaction-section">
<!-- BEGIN: QuickSuggestions -->
<!-- Recommended query shortcut list items -->
<div class="flex flex-col space-y-4 px-1" data-purpose="prompt-suggestions">
<!-- Item 1: Image / Sticker -->
<button class="group flex items-center space-x-3 text-left w-fit active:opacity-60 transition-opacity" type="button">
<svg class="w-5 h-5 text-[#8e8e93] shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="3"></rect>
<circle cx="8.5" cy="8.5" r="1.5"></circle>
<polyline points="21 15 16 10 5 21"></polyline>
</svg>
<span class="text-[17px] text-[#e0e0e0] font-normal tracking-wide">Create an image or sticker</span>
</button>
<!-- Item 2: Write or Edit -->
<button class="group flex items-center space-x-3 text-left w-fit active:opacity-60 transition-opacity" type="button">
<svg class="w-5 h-5 text-[#8e8e93] shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
</svg>
<span class="text-[17px] text-[#e0e0e0] font-normal tracking-wide">Write or edit</span>
</button>
<!-- Item 3: Search the web -->
<button class="group flex items-center space-x-3 text-left w-fit active:opacity-60 transition-opacity" type="button">
<svg class="w-5 h-5 text-[#8e8e93] shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<line x1="2" x2="22" y1="12" y2="12"></line>
<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
</svg>
<span class="text-[17px] text-[#e0e0e0] font-normal tracking-wide">Search the web</span>
</button>
</div>
<!-- END: QuickSuggestions -->
<!-- BEGIN: InputBarContainer -->
<div class="w-full relative" data-purpose="chat-input-bar">
<div class="w-full h-14 bg-[#141414] border border-[#232323] rounded-full px-3 flex items-center justify-between shadow-2xl">
<!-- Left Section: Plus Action Button & Placeholder text -->
<div class="flex items-center space-x-3 flex-1 overflow-hidden pr-2">
<!-- Plus Icon Button -->
<button aria-label="Attach or add tools" class="w-8 h-8 rounded-full flex items-center justify-center text-white active:bg-white/10 transition-colors shrink-0" type="button">
<svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<line stroke-linecap="round" x1="12" x2="12" y1="5" y2="19"></line>
<line stroke-linecap="round" x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
<!-- Input/Placeholder Area -->
<input class="bg-transparent border-none p-0 text-[17px] text-white placeholder-[#5a5a5e] focus:outline-none focus:ring-0 w-full tracking-tight font-normal" placeholder="Talk to ChatGPT" type="text">
</div>
<!-- Right Section: Mic & Voice Orb Button -->
<div class="flex items-center space-x-2 shrink-0">
<!-- Dictation / Microphone Button -->
<button aria-label="Dictate message" class="w-9 h-9 rounded-full flex items-center justify-center text-white active:opacity-70 transition-opacity" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="23"></line>
<line x1="8" x2="16" y1="23" y2="23"></line>
</svg>
</button>
<!-- Voice Mode Launcher Orb (Bright Blue with 4 Sound Wave Bars) -->
<button aria-label="Open voice mode" class="w-10 h-10 rounded-full bg-[#1b84ff] flex items-center justify-center active:scale-95 transition-transform shadow-md shadow-blue-500/20" type="button">
<!-- 4 Vertical Voice Waveform Lines -->
<div class="flex items-center justify-center space-x-[2.5px] h-4">
<span class="w-[2.5px] h-2.5 bg-white rounded-full"></span>
<span class="w-[2.5px] h-4 bg-white rounded-full"></span>
<span class="w-[2.5px] h-3 bg-white rounded-full"></span>
<span class="w-[2.5px] h-2 bg-white rounded-full"></span>
</div>
</button>
</div>
</div>
</div>
<!-- END: InputBarContainer -->
</div>
<!-- END: BottomSuggestionsAndInput -->


</body></html>
