<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>ChatGPT iOS App</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBlack: '#000000',
            appCardBg: '#1c1c1e',
            appMenuBg: '#1f1f23',
            appSubtle: '#2c2c2e',
            appInput: '#171717',
            chatBlue: '#0c446e',
            chatBlueDark: '#08385c',
            textGray: '#8e8e93',
            textLightGray: '#a1a1aa'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scrollbars">
    /* Hide scrollbars for authentic mobile app appearance */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
<style data-purpose="app-shell">
    /* iOS frame simulator styles */
    body {
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    }
    .iphone-frame {
      width: 100%;
      max-width: 430px;
      height: 932px;
      position: relative;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body class="bg-black text-white" data-mode="connect">
<!-- BEGIN: PhoneContainer -->
<div class="iphone-frame shadow-2xl relative" data-purpose="mobile-viewport">
<!-- BEGIN: StatusBar -->
<header class="w-full pt-3 px-8 flex justify-between items-center z-30 select-none text-white font-semibold text-sm tracking-tight" data-purpose="status-bar">
<!-- Time -->
<span class="text-[17px] font-semibold tracking-tight ml-1">11:24</span>
<!-- Dynamic Island Indicator / System icons -->
<div class="flex items-center space-x-2">
<!-- Cellular bars -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-5h3v13h-3V8zm5-5h3v18h-3V3z"></path>
</svg>
<!-- Wifi icon -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.25c3.78 0 7.21 1.5 9.77 3.96L12 19.24 2.23 11.21C4.79 8.75 8.22 7.25 12 7.25z"></path>
</svg>
<!-- Battery icon -->
<div class="relative w-6 h-3 border border-white/80 rounded-[4px] p-0.5 flex items-center">
<div class="h-full bg-white rounded-[1.5px] w-full"></div>
<div class="absolute -right-1 top-1 w-0.5 h-1 bg-white/80 rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: TopNavigationBar -->
<nav class="w-full px-4 pt-2.5 pb-1 flex items-center justify-between z-20" data-purpose="top-navigation">
<!-- Left: Menu toggle -->
<button aria-label="Open sidebar" class="w-10 h-10 rounded-full bg-[#242426] flex items-center justify-center text-white/90 active:scale-95 transition-transform">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<line x1="4" x2="20" y1="9" y2="9"></line>
<line x1="4" x2="20" y1="15" y2="15"></line>
</svg>
</button>
<!-- Right: Action capsule (New Chat + More) -->
<div class="flex items-center bg-[#242426] rounded-full px-3 py-1.5 space-x-3.5">
<!-- Edit/Compose icon -->
<button aria-label="New chat" class="text-white/90 hover:text-white">
<svg class="w-4 h-4 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M12 20h9"></path>
<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
</svg>
</button>
<!-- More options icon -->
<button aria-label="More options" class="text-white/90 hover:text-white">
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<circle cx="5" cy="12" r="2"></circle>
<circle cx="12" cy="12" r="2"></circle>
<circle cx="19" cy="12" r="2"></circle>
</svg>
</button>
</div>
</nav>
<!-- END: TopNavigationBar -->
<!-- Optional model subheader -->
<div class="px-5 pt-0 pb-1 flex items-center">
<span class="text-white font-medium text-base tracking-tight">Hey!</span>
</div>
<!-- BEGIN: ChatScrollArea -->
<main class="flex-1 overflow-y-auto px-4 space-y-4 pt-1 relative" data-purpose="chat-messages-container">
<!-- User Message Pill -->
<div class="flex justify-end pt-1" data-purpose="user-message">
<article class="bg-[#0b3c63] text-white px-4 py-3 rounded-[24px] max-w-[82%] text-[15px] leading-snug tracking-tight font-normal text-left shadow-sm">Hey ChatGPT, what's a quick way to remember Porter's Five Forces before my strategy exam?</article>
</div>
<!-- Assistant Response Flow -->
<div class="flex flex-col items-start space-y-2.5 max-w-[88%]" data-purpose="assistant-message">
<div class="text-[15px] leading-[1.38] text-white/90 font-normal tracking-normal pr-2">Try the acronym 'CRIST' — Competitive rivalry, Rivalry... want me to make a mnemonic sentence instead?</div>
<!-- Assistant Action Icons -->
<div class="flex items-center space-x-3 text-[#9e9ea5] pt-0.5 pl-0.5" data-purpose="assistant-actions">
<!-- Copy -->
<button aria-label="Copy response" class="hover:text-white transition-colors">
<svg class="w-4 h-4 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<rect height="13" rx="2" ry="2" width="13" x="9" y="9"></rect>
<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
</svg>
</button>
<!-- Thumbs up -->
<button aria-label="Good response" class="hover:text-white transition-colors">
<svg class="w-4 h-4 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" class=""></path>
</svg>
</button>
<!-- Thumbs down -->
<button aria-label="Bad response" class="hover:text-white transition-colors">
<svg class="w-4 h-4 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path>
</svg>
</button>
<!-- Share -->
<button aria-label="Share response" class="hover:text-white transition-colors">
<svg class="w-4 h-4 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
<polyline points="16 6 12 2 8 6"></polyline>
<line x1="12" x2="12" y1="2" y2="15"></line>
</svg>
</button>
<!-- More options -->
<button aria-label="More message options" class="hover:text-white transition-colors">
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<circle cx="5" cy="12" r="2"></circle>
<circle cx="12" cy="12" r="2"></circle>
<circle cx="19" cy="12" r="2"></circle>
</svg>
</button>
</div>
</div>
<!-- BEGIN: FloatingContextMenu -->
<!-- Positioned relative over the conversation as depicted in the snapshot -->
<div class="flex justify-end pt-1" data-purpose="user-message-2">
<article class="bg-[#0b3c63] text-white px-4 py-3 rounded-[24px] max-w-[82%] text-[15px] leading-snug tracking-tight font-normal text-left shadow-sm">
  Yeah, do that
</article>
</div><div class="absolute right-4 w-[270px] bg-[#1d1d20]/95 backdrop-blur-xl rounded-[26px] py-3.5 px-1 shadow-[0_20px_50px_rgba(0,0,0,0.8)] border border-white/10 z-40" data-purpose="context-menu-popup" style="top: 96px;">
<!-- Timestamp Header -->
<div class="px-4 pb-2.5 pt-0.5 text-[#8e8e93] text-[13px] font-medium tracking-tight">
          Today, 11:23 PM
        </div>
<!-- Menu Action Items -->
<div class="flex flex-col space-y-0.5">
<!-- Copy -->
<button class="w-full flex items-center justify-between px-4 py-2.5 hover:bg-white/10 active:bg-white/15 rounded-xl transition-colors text-left group">
<span class="text-[16px] text-white font-normal">Copy</span>
<svg class="w-5 h-5 stroke-[#d1d1d6] fill-none group-hover:text-white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<rect height="13" rx="2" ry="2" width="13" x="9" y="9"></rect>
<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
</svg>
</button>
<!-- Edit -->
<button class="w-full flex items-center justify-between px-4 py-2.5 hover:bg-white/10 active:bg-white/15 rounded-xl transition-colors text-left group">
<span class="text-[16px] text-white font-normal">Edit</span>
<svg class="w-5 h-5 stroke-[#d1d1d6] fill-none group-hover:text-white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
</svg>
</button>
<!-- Select text -->
<button class="w-full flex items-center justify-between px-4 py-2.5 hover:bg-white/10 active:bg-white/15 rounded-xl transition-colors text-left group">
<span class="text-[16px] text-white font-normal">Select text</span>
<svg class="w-5 h-5 stroke-[#d1d1d6] fill-none group-hover:text-white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M7 4H4v3m0 10v3h3m10-16h3v3m0 10v3h-3"></path>
<line x1="9" x2="15" y1="9" y2="9"></line>
<line x1="12" x2="12" y1="9" y2="15"></line>
<line x1="9" x2="15" y1="15" y2="15"></line>
</svg>
</button>
<!-- Bad transcription -->
<button class="w-full flex items-center justify-between px-4 py-2.5 hover:bg-white/10 active:bg-white/15 rounded-xl transition-colors text-left group">
<span class="text-[16px] text-white font-normal">Bad transcription</span>
<svg class="w-5 h-5 stroke-[#d1d1d6] fill-none group-hover:text-white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path>
</svg>
</button>
<!-- Share prompt -->
<button class="w-full flex items-center justify-between px-4 py-2.5 hover:bg-white/10 active:bg-white/15 rounded-xl transition-colors text-left group">
<span class="text-[16px] text-white font-normal">Share prompt</span>
<svg class="w-5 h-5 stroke-[#d1d1d6] fill-none group-hover:text-white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
<polyline points="16 6 12 2 8 6"></polyline>
<line x1="12" x2="12" y1="2" y2="15"></line>
</svg>
</button>
</div>
</div>
<!-- END: FloatingContextMenu -->
</main>
<!-- END: ChatScrollArea -->
<!-- BEGIN: BottomInputSection -->
<footer class="w-full px-3 pb-6 pt-1 flex flex-col items-center space-y-2 bg-gradient-to-t from-black via-black to-transparent" data-purpose="chat-controls">
<!-- Conversation Feedback Pill -->
<aside class="w-full max-w-[395px] bg-[#222225] rounded-2xl px-4 py-3 flex items-center justify-between text-sm" data-purpose="feedback-banner">
<span class="text-white/80 text-[14px]">How was this conversation?</span>
<div class="flex items-center space-x-3.5 text-white/80">
<!-- Dislike Button -->
<button aria-label="Dislike conversation" class="hover:text-white transition-colors">
<svg class="w-5 h-5 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path>
</svg>
</button>
<!-- Like Button -->
<button aria-label="Like conversation" class="hover:text-white transition-colors">
<svg class="w-5 h-5 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
</svg>
</button>
</div>
</aside>
<!-- Input Pill Bar -->
<div class="w-full max-w-[395px] bg-[#1e1e21] rounded-full p-1.5 flex items-center justify-between border border-white/5" data-purpose="message-input-bar">
<!-- Add / Attach Button -->
<button aria-label="Attach file" class="w-9 h-9 rounded-full flex items-center justify-center text-white/90 hover:bg-white/10 transition-colors">
<svg class="w-5 h-5 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
<!-- Placeholder text -->
<div class="flex-1 text-[16px] text-[#6b6b72] px-2 select-none font-normal">Talk to ChatGPT</div>
<!-- Right action icons -->
<div class="flex items-center space-x-1.5 pr-0.5">
<!-- Voice Dictation / Mic -->
<button aria-label="Voice input" class="w-9 h-9 flex items-center justify-center text-white/90 hover:text-white transition-colors">
<svg class="w-5 h-5 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="23"></line>
<line x1="8" x2="16" y1="23" y2="23"></line>
</svg>
</button>
<!-- Voice Live Mode Button -->
<button aria-label="Open voice mode" class="w-9 h-9 rounded-full bg-[#1877f2] flex items-center justify-center text-white active:scale-95 transition-transform">
<svg class="w-5 h-5 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<line x1="4" x2="4" y1="10" y2="14"></line>
<line x1="8" x2="8" y1="6" y2="18"></line>
<line x1="12" x2="12" y1="3" y2="21"></line>
<line x1="16" x2="16" y1="7" y2="17"></line>
<line x1="20" x2="20" y1="11" y2="13"></line>
</svg>
</button>
</div>
</div>
<!-- iOS Home Indicator -->
<div class="pt-2 w-full flex justify-center" data-purpose="home-indicator">
<div class="w-36 h-1 bg-white/40 rounded-full"></div>
</div>
</footer>
<!-- END: BottomInputSection -->
</div>
<!-- END: PhoneContainer -->






</body></html>
