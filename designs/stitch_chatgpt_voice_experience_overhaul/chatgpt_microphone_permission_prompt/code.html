<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>ChatGPT - Microphone Permission Dialog</title>
<!-- Tailwind CSS v3 with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#000000',
              surface: '#212121',
              surfaceLight: '#2f2f2f',
              pillBlue: '#1d2e47',
              pillText: '#3b82f6',
              voiceBlue: '#2563eb',
              grayIcon: '#8e8e93',
              borderMuted: 'rgba(255, 255, 255, 0.08)',
            },
            fontFamily: {
              sans: [
                '-apple-system',
                'BlinkMacSystemFont',
                '"SF Pro Text"',
                '"SF Pro Display"',
                'Helvetica Neue',
                'Arial',
                'sans-serif'
              ]
            }
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom iOS & Modal Styling -->
<style data-purpose="base-layout">
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* Device frame simulation for desktop preview */
    .mobile-screen {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 932px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: #000000;
    }
  </style>
<style data-purpose="modal-effects">
    /* Subtle blur & backdrop dimming to reflect the modal focus */
    .dialog-backdrop-tint {
      background-color: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    
    .permission-card {
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
  </style>
<!-- END: Custom iOS & Modal Styling -->
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
<!-- BEGIN: Mobile Screen Container -->
<div class="mobile-screen" data-purpose="screen-wrapper" style="max-width: 393px; height: 852px; max-height: 852px;">
<!-- BEGIN: iOS Status Bar -->
<header class="w-full pt-3 px-6 flex justify-between items-center z-30 shrink-0 text-white font-semibold text-sm tracking-tight" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold pl-1">7:09</span>
<!-- Status Bar Icons (Cellular, WiFi, Battery) -->
<div class="flex items-center space-x-1.5 pr-0.5">
<!-- Cellular Bars -->
<svg class="w-4 h-3 fill-current" fill="none" viewBox="0 0 17 11">
<rect height="3" rx="0.75" width="3" x="0" y="8"></rect>
<rect height="5.5" rx="0.75" width="3" x="4.5" y="5.5"></rect>
<rect height="8" rx="0.75" width="3" x="9" y="3"></rect>
<rect height="11" rx="0.75" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-3.5 h-3 fill-current" viewBox="0 0 16 12">
<path clip-rule="evenodd" d="M8 3.6c2.4 0 4.6.9 6.2 2.4l1.4-1.4C13.8 2.8 11 1.8 8 1.8S2.2 2.8.4 4.6l1.4 1.4C3.4 4.5 5.6 3.6 8 3.6zm0 4.2c1.3 0 2.5.5 3.4 1.3l1.4-1.4c-1.3-1.1-2.9-1.7-4.8-1.7s-3.5.6-4.8 1.7l1.4 1.4c.9-.8 2.1-1.3 3.4-1.3zm0 4.2a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-6 h-[11.5px] border border-white/80 rounded-[4px] p-0.5 flex items-center">
<div class="h-full w-full bg-white rounded-[1.5px]"></div>
</div>
<div class="w-[1.5px] h-1 bg-white/80 rounded-r-sm -ml-[0.5px]"></div>
</div>
</div>
</header>
<!-- END: iOS Status Bar -->
<!-- BEGIN: Top Navigation Bar -->
<nav class="w-full px-5 pt-3 pb-2 flex items-center justify-between z-20 shrink-0" data-purpose="app-navigation">
<!-- Left Drawer / Menu Icon Button -->
<button aria-label="Open Sidebar Menu" class="w-11 h-11 rounded-full bg-[#1c1c1e] active:bg-[#2c2c2e] flex items-center justify-center transition-colors focus:outline-none" type="button">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M4 8h16M4 16h16"></path>
</svg>
</button>
<!-- Center '+ Upgrade' Pill Badge -->
<button aria-label="Upgrade Plan" class="h-10 px-4 rounded-full bg-[#132338] active:bg-[#1a304e] border border-blue-500/20 flex items-center space-x-1.5 transition-colors focus:outline-none" type="button">
<!-- Blue Sparkle Icon -->
<svg class="w-4 h-4 text-blue-400 fill-current" viewBox="0 0 24 24">
<path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path>
</svg>
<span class="text-blue-400 font-medium text-[15px]">Upgrade</span>
</button>
<!-- Right New Chat / Conversation Icon Button -->
<button aria-label="New Chat" class="w-11 h-11 rounded-full bg-[#1c1c1e] active:bg-[#2c2c2e] flex items-center justify-center transition-colors focus:outline-none" type="button">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
</svg>
</button>
</nav>
<!-- END: Top Navigation Bar -->
<!-- BEGIN: Background Content Layer (Prompts and Canvas) -->
<main class="flex-1 flex flex-col justify-end px-5 pb-3 relative" data-purpose="chat-main-content">
<!-- Subdued Suggestion Action Links (Visible in backdrop) -->
<div class="space-y-4 mb-5 opacity-40 select-none pointer-events-none" data-purpose="shortcut-suggestions">
<!-- Item 1: Create an image or sticker -->
<div class="flex items-center space-x-3 text-[17px] text-[#e0e0e0] font-normal">
<svg class="w-6 h-6 text-[#9a9a9f]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="18" rx="3" width="18" x="3" y="3"></rect>
<circle cx="8.5" cy="8.5" r="1.5"></circle>
<path d="M21 15l-5-5L5 21"></path>
</svg>
<span class="">Create an image or sticker</span>
</div>
<!-- Item 2: Write or edit -->
<div class="flex items-center space-x-3 text-[17px] text-[#e0e0e0] font-normal">
<svg class="w-6 h-6 text-[#9a9a9f]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
</svg>
<span class="">Write or edit</span>
</div>
<!-- Item 3: Search the web -->
<div class="flex items-center space-x-3 text-[17px] text-[#e0e0e0] font-normal">
<svg class="w-6 h-6 text-[#9a9a9f]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<line x1="2" x2="22" y1="12" y2="12"></line>
<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
</svg>
<span class="">Search the web</span>
</div>
</div>
<!-- Bottom Pill Input Field (Subdued under modal tint) -->
<div class="w-full opacity-40 pointer-events-none select-none" data-purpose="chat-input-bar">
<div class="h-14 bg-[#1e1e1e] border border-white/5 rounded-full px-3.5 flex items-center justify-between">
<!-- Plus attachment icon -->
<div class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</div>
<!-- Input placeholder text -->
<span class="flex-1 text-left px-2 text-[#7e7e82] text-[16px] font-normal">Ask ChatGPT</span>
<!-- Right side icons: Dictation & Voice Orb Button -->
<div class="flex items-center space-x-2">
<div class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="23"></line>
<line x1="8" x2="16" y1="23" y2="23"></line>
</svg>
</div>
<div class="w-10 h-10 rounded-full bg-[#1877f2] flex items-center justify-center text-white shadow-lg">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<rect height="8" rx="1" width="2" x="5" y="8"></rect>
<rect height="16" rx="1" width="2" x="9.5" y="4"></rect>
<rect height="12" rx="1" width="2" x="14" y="6"></rect>
<rect height="6" rx="1" width="2" x="18.5" y="9"></rect>
</svg>
</div>
</div>
</div>
</div>
</main>
<!-- END: Background Content Layer -->
<!-- BEGIN: Permission Dialog Overlay Layer -->
<div class="absolute inset-0 z-40 flex items-center justify-center px-6 dialog-backdrop-tint" data-purpose="permission-modal-overlay">
<!-- Permission Card Container -->
<section aria-labelledby="dialog-title" aria-modal="true" class="w-full max-w-[340px] bg-[#1e1e1e] border border-white/10 rounded-[32px] p-6 flex flex-col items-center permission-card transition-all transform" data-purpose="microphone-permission-card" role="dialog" style="border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: rgba(0, 0, 0, 0.85) 0px 25px 50px -12px, rgba(255, 255, 255, 0.08) 0px 0px 0px 1px;">
<!-- Title Section -->
<h2 class="text-white text-[24px] font-bold text-center leading-tight tracking-tight mb-7 px-1 pt-1" id="dialog-title">
          Microphone<br>access required
        </h2>
<!-- Action Buttons Section -->
<div class="w-full flex flex-col space-y-3" data-purpose="modal-actions">
<!-- Primary Action: Allow -->
<button class="w-full h-14 bg-white active:bg-gray-200 text-black font-semibold text-[17px] rounded-full transition-all duration-150 flex items-center justify-center shadow-md focus:outline-none" data-purpose="action-allow" type="button">
            Allow
          </button>
<!-- Secondary Action: Don't Allow -->
<button class="w-full h-14 bg-[#2e2e30] active:bg-[#38383a] text-white font-semibold text-[17px] rounded-full border border-white/5 transition-all duration-150 flex items-center justify-center focus:outline-none" data-purpose="action-dont-allow" type="button">
            Don't Allow
          </button>
</div>
</section>
<!-- END: Permission Card Container -->
</div>
<!-- END: Permission Dialog Overlay Layer -->
<!-- BEGIN: iOS Home Indicator -->
<footer class="w-full h-7 flex items-center justify-center shrink-0 z-50 pointer-events-none pb-2" data-purpose="ios-home-indicator"></footer>
<!-- END: iOS Home Indicator -->
</div>
<!-- END: Mobile Screen Container -->




</body></html>
