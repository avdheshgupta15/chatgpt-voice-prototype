<!DOCTYPE html><html class="h-full bg-black" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>ChatGPT Mobile Interface</title>
<!-- Tailwind CSS v3 CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            iosDarkBg: '#000000',
            iosKeyBg: '#59595d',
            iosSpecialKeyBg: '#363638',
            iosKbBg: '#1c1c1e',
            iosInputBg: '#18181b',
            gptBlue: '#258cfb',
            textGray: '#8e8e93',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="ios-keyboard-custom">
    /* Subtle keycap depth and shadow typical of iOS keyboards */
    .ios-key {
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
      user-select: none;
      -webkit-user-select: none;
    }
    .ios-key:active {
      filter: brightness(1.25);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="h-full bg-black text-white font-sans antialiased overflow-hidden flex justify-center">
<!-- Mobile Screen Container (iPhone 15/16 Pro Ratio) -->
<div class="relative w-full max-w-[430px] h-full flex flex-col justify-between bg-black text-white select-none">
<!-- BEGIN: HeaderAndCanvas -->
<div class="flex flex-col flex-1 min-h-0">
<!-- BEGIN: iOS StatusBar -->
<header class="w-full pt-3 px-8 flex justify-between items-center text-white text-[15px] font-semibold tracking-tight z-20">
<!-- Time -->
<span class="pl-1">9:35</span>
<!-- Status Icons -->
<div class="flex items-center space-x-2">
<!-- Cellular Signal Bars -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 18 14">
<rect height="4" rx="0.5" width="3" x="0" y="10"></rect>
<rect height="7" rx="0.5" width="3" x="4.5" y="7"></rect>
<rect height="10" rx="0.5" width="3" x="9" y="4"></rect>
<rect height="14" rx="0.5" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 18c.8 0 1.5.7 1.5 1.5S12.8 21 12 21s-1.5-.7-1.5-1.5S11.2 18 12 18zm-4.9-3.2c2.7-2.7 7.1-2.7 9.8 0l1.4-1.4c-3.5-3.5-9.1-3.5-12.6 0l1.4 1.4zm-3.5-3.6c4.6-4.6 12.2-4.6 16.8 0l1.4-1.4c-5.4-5.4-14.2-5.4-19.6 0l1.4 1.4z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 rounded-[4px] border border-white/80 p-0.5 flex items-center relative">
<div class="h-full w-full bg-white rounded-[1.5px]"></div>
<div class="absolute -right-[3px] top-1/2 -translate-y-1/2 w-0.5 h-1.5 bg-white/80 rounded-r-[1px]"></div>
</div>
</div>
</header>
<!-- END: iOS StatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="w-full px-4 pt-3 flex justify-between items-center z-10">
<div class="flex items-center space-x-3">
<!-- Sidebar Toggle Button -->
<button aria-label="Open Sidebar" class="w-10 h-10 rounded-full bg-[#1c1c1e] flex flex-col justify-center items-center space-y-1.5 active:bg-neutral-700 transition">
<span class="w-5 h-[2px] bg-white rounded-full"></span>
<span class="w-5 h-[2px] bg-white rounded-full"></span>
</button>
<!-- Upgrade Pill Button -->
<button class="h-10 px-4 rounded-full bg-[#1c1c1e] flex items-center space-x-2 active:bg-neutral-700 transition">
<!-- Sparkle Diamond Icon -->
<svg class="w-4 h-4 text-[#388bfd] fill-current" viewBox="0 0 24 24">
<path d="M12 2L9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z"></path>
</svg>
<span class="text-sm font-medium text-[#388bfd]">Upgrade</span>
</button>
</div>
<!-- Chat Bubble Button -->
<button aria-label="New Chat" class="w-10 h-10 rounded-full bg-[#1c1c1e] flex items-center justify-center active:bg-neutral-700 transition">
<svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
</svg>
</button>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: PromptSuggestionsArea -->
<!-- Spacer pushes suggestions to bottom above input bar -->
<div class="flex-1"></div>
<div class="px-5 pb-3 flex flex-col space-y-4">
<!-- Suggestion Item: Image -->
<button class="flex items-center space-x-3.5 text-left text-[17px] font-normal text-white/90 active:opacity-60 transition">
<svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="18" rx="4" ry="4" width="18" x="3" y="3"></rect>
<circle cx="8.5" cy="8.5" r="1.5"></circle>
<polyline points="21 15 16 10 5 21"></polyline>
</svg>
<span class="tracking-tight">Create an image or sticker</span>
</button>
<!-- Suggestion Item: Write or edit -->
<button class="flex items-center space-x-3.5 text-left text-[17px] font-normal text-white/90 active:opacity-60 transition">
<svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M12 20h9"></path>
<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
</svg>
<span class="tracking-tight">Write or edit</span>
</button>
<!-- Suggestion Item: Search the web -->
<button class="flex items-center space-x-3.5 text-left text-[17px] font-normal text-white/90 active:opacity-60 transition">
<svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<line x1="2" x2="22" y1="12" y2="12"></line>
<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
</svg>
<span class="tracking-tight">Search the web</span>
</button>
</div>
<!-- END: PromptSuggestionsArea -->
<!-- BEGIN: ActiveChatInputBar -->
<div class="px-3 pb-2 pt-1">
<div class="h-14 bg-[#1e1e20] rounded-full flex items-center px-2.5 justify-between shadow-sm">
<div class="flex items-center space-x-3 flex-1 pl-1">
<!-- Add / Attach Button -->
<button class="w-8 h-8 flex items-center justify-center text-white/80 active:opacity-60">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
<!-- Text Input Field / Placeholder -->
<div class="flex items-center text-[17px] text-zinc-400 font-normal">
<span class="">Talk to ChatGPT</span>
<!-- Blinking cursor showing active focus state -->
<span class="w-[2px] h-5 bg-[#2F80ED] ml-0.5 animate-pulse"></span>
</div>
</div>
<!-- Right Action Controls in Pill -->
<div class="flex items-center space-x-2">
<!-- Mic Dictation Icon -->
<button class="w-8 h-8 flex items-center justify-center text-white/90 active:opacity-60">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="23"></line>
</svg>
</button>
<!-- Blue Waveform Voice Button -->
<button class="w-9 h-9 rounded-full bg-[#1877F2] flex items-center justify-center shadow active:scale-95 transition">
<div class="flex items-center space-x-0.5 h-4">
<span class="w-[2.5px] h-2.5 bg-white rounded-full"></span>
<span class="w-[2.5px] h-4 bg-white rounded-full"></span>
<span class="w-[2.5px] h-3 bg-white rounded-full"></span>
<span class="w-[2.5px] h-1.5 bg-white rounded-full"></span>
</div>
</button>
</div>
</div>
</div>
<!-- END: ActiveChatInputBar -->
</div>
<!-- END: HeaderAndCanvas -->
<!-- BEGIN: NativeIOSKeyboard -->
<div class="bg-[#1b1b1d] w-full pt-2 pb-1 select-none text-white flex flex-col justify-end">
<!-- Suggestion / Autocorrect Bar -->
<div class="h-10 px-3 grid grid-cols-4 items-center text-center text-[15px] font-normal tracking-tight text-white mb-2">
<!-- Reorder / Mode Toggle Icon -->
<div class="flex justify-center text-zinc-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<polyline points="7 10 12 5 17 10"></polyline>
<polyline points="7 14 12 19 17 14"></polyline>
</svg>
</div>
<!-- Suggestion 1 -->
<span class="border-r border-zinc-700/60 truncate px-1">Hun</span>
<!-- Suggestion 2 -->
<span class="border-r border-zinc-700/60 truncate px-1 font-medium">Temane</span>
<!-- Suggestion 3 & Layout Indicator -->
<div class="flex items-center justify-between pl-3 pr-1">
<span class="truncate">Su</span>
<span class="text-[12px] bg-zinc-700 text-zinc-300 px-1 rounded font-medium ml-1">A</span>
</div>
</div>
<!-- Main Key Rows Container -->
<div class="px-1.5 space-y-3 pb-2">
<!-- First Row: Q - P -->
<div class="flex justify-between space-x-1.5">
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">Q</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">W</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">E</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">R</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">T</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">Y</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">U</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">I</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">O</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">P</div>
</div>
<!-- Second Row: A - L (Indented standard iOS style) -->
<div class="flex justify-center space-x-1.5 px-[15px]">
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">A</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">S</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">D</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">F</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">G</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">H</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">J</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">K</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">L</div>
</div>
<!-- Third Row: Shift + Z - M + Backspace -->
<div class="flex justify-between space-x-1.5">
<!-- Shift Key -->
<div class="ios-key w-[42px] h-[42px] bg-iosSpecialKeyBg rounded-[6px] flex items-center justify-center">
<svg class="w-5 h-5 fill-white" viewBox="0 0 24 24">
<path d="M12 4l-7 8h4.5v8h5v-8H19z"></path>
</svg>
</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">Z</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">X</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">C</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">V</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">B</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">N</div>
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-center justify-center text-[22px] font-light">M</div>
<!-- Backspace / Delete Key -->
<div class="ios-key w-[42px] h-[42px] bg-iosSpecialKeyBg rounded-[6px] flex items-center justify-center">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
<line x1="18" x2="12" y1="9" y2="15"></line>
<line x1="12" x2="18" y1="9" y2="15"></line>
</svg>
</div>
</div>
<!-- Fourth Row: 123 + Space + Return -->
<div class="flex justify-between space-x-1.5 pt-0.5">
<!-- 123 Numeric Switcher -->
<div class="ios-key w-[84px] h-[42px] bg-iosSpecialKeyBg rounded-[6px] flex items-center justify-center text-[16px]">
            123
          </div>
<!-- Spacebar -->
<div class="ios-key flex-1 h-[42px] bg-iosKeyBg rounded-[6px] flex items-end justify-center pb-1 text-[11px] font-medium text-zinc-400">
            EN GU
          </div>
<!-- Return Key -->
<div class="ios-key w-[84px] h-[42px] bg-iosSpecialKeyBg rounded-[6px] flex items-center justify-center">
<svg class="w-5 h-5 text-white stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<polyline points="9 10 4 15 9 20"></polyline>
<path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
</svg>
</div>
</div>
<!-- Bottom Row: Emoji & Voice Input Shortcut -->
<div class="flex justify-between items-center px-4 pt-2">
<!-- Emoji Key -->
<button class="text-white/80 active:opacity-60 transition">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
<line stroke-linecap="round" stroke-width="2.5" x1="9" x2="9.01" y1="9" y2="9"></line>
<line stroke-linecap="round" stroke-width="2.5" x1="15" x2="15.01" y1="9" y2="9"></line>
</svg>
</button>
<!-- Voice Dictation Key -->
<button class="text-white/80 active:opacity-60 transition">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="23"></line>
</svg>
</button>
</div>
</div>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pb-2 pt-1">
<div class="w-36 h-[5px] bg-white rounded-full opacity-70"></div>
</div>
</div>
<!-- END: NativeIOSKeyboard -->
</div>


</body></html>
