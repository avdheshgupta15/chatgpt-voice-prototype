<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>ChatGPT Mobile Interface</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind Custom Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            chatgpt: {
              black: '#000000',
              bubble: '#0B477D',
              surface: '#212121',
              pill: '#171717',
              muted: '#8E8E93',
              voice: '#10A37F',
              accentBlue: '#007AFF',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scrollbars-and-reset">
    /* Prevent bouncy overshoot and ensure sleek mobile canvas */
    html, body {
      background-color: #000000;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Hide scrollbars while preserving scrolling capability */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-black text-white font-sans flex justify-center items-start min-h-screen">
<!-- BEGIN: PhoneContainer -->
<!-- iPhone 15 frame aspect layout (393px width reference) -->
<div class="w-full max-w-[420px] min-h-screen h-full flex flex-col justify-between bg-black relative px-4 pb-2 pt-0 selection:bg-blue-600">
<!-- BEGIN: TopFixedSection -->
<div class="sticky top-0 z-30 bg-black/95 backdrop-blur-md pb-2">
<!-- iOS Status Bar -->
<div class="w-full h-11 flex justify-between items-center px-4 pt-2 select-none" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-white pl-1">8:53</span>
<!-- Right System Indicators -->
<div class="flex items-center space-x-1.5 pr-0.5">
<!-- Cellular Network Indicator (4 bars) -->
<svg class="w-4 h-3.5 fill-current text-white" viewBox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0.5" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="8.5" y="3"></rect>
<rect height="11.5" rx="0.5" width="2.5" x="12.5" y="0.5"></rect>
</svg>
<!-- WiFi Icon -->
<svg class="w-4 h-3.5 fill-current text-white ml-0.5" viewBox="0 0 16 12">
<path clip-rule="evenodd" d="M8 2.5C5.1 2.5 2.5 3.7 0.7 5.7L0 4.9C2 2.7 4.9 1.3 8 1.3C11.1 1.3 14 2.7 16 4.9L15.3 5.7C13.5 3.7 10.9 2.5 8 2.5ZM8 6C6.1 6 4.4 6.8 3.2 8.1L2.5 7.3C3.9 5.8 5.8 4.8 8 4.8C10.2 4.8 12.1 5.8 13.5 7.3L12.8 8.1C11.6 6.8 9.9 6 8 6ZM8 9.5C6.9 9.5 6 10.4 6 11.5C6 11.8 6.2 12 6.5 12C6.8 12 7 11.8 7 11.5C7 11 7.4 10.5 8 10.5C8.6 10.5 9 11 9 11.5C9 11.8 9.2 12 9.5 12C9.8 12 10 11.8 10 11.5C10 10.4 9.1 9.5 8 9.5Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon with Level -->
<div class="relative w-6 h-3 rounded-[4px] border border-white flex items-center p-0.5 ml-0.5">
<div class="h-full w-4 bg-white rounded-sm"></div>
<div class="absolute -right-[3px] top-1/2 -translate-y-1/2 w-[2px] h-1.5 bg-white rounded-r-xs"></div>
</div>
</div>
</div>
<!-- Header Navigation Bar -->
<header class="flex items-center justify-between pt-1.5 pb-2" data-purpose="app-navigation-header">
<!-- Left Menu Button: Circle with 2 horizontal bars -->
<button aria-label="Open sidebar" class="w-10 h-10 rounded-full bg-[#1e1e1e] flex items-center justify-center text-white active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5 stroke-current stroke-[2.2]" fill="none" viewBox="0 0 24 24">
<line stroke-linecap="round" x1="4" x2="20" y1="8" y2="8"></line>
<line stroke-linecap="round" x1="4" x2="20" y1="16" y2="16"></line>
</svg>
</button>
<!-- Right Header Action Pill (Compose & More Options) -->
<div class="h-10 rounded-full bg-[#1e1e1e] flex items-center px-2 space-x-2" data-purpose="header-action-group">
<!-- Compose / New Chat Icon -->
<button aria-label="New chat" class="w-7 h-7 flex items-center justify-center text-white active:opacity-75" type="button">
<svg class="w-4 h-4 stroke-current stroke-[2] fill-none" viewBox="0 0 24 24">
<path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Three Horizontal Dots Icon -->
<button aria-label="Conversation options" class="w-7 h-7 flex items-center justify-center text-white active:opacity-75" type="button">
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<circle cx="5" cy="12" r="2"></circle>
<circle cx="12" cy="12" r="2"></circle>
<circle cx="19" cy="12" r="2"></circle>
</svg>
</button>
</div>
</header>
</div>
<!-- END: TopFixedSection -->
<!-- BEGIN: ChatScrollStream -->
<main class="flex-1 overflow-y-auto no-scrollbar pt-2 pb-6 flex flex-col space-y-7" data-purpose="conversation-stream">
<!-- User Message Row -->
<article class="flex justify-end pl-10" data-purpose="user-message">
<div class="bg-[#0B477D] text-white text-[16px] leading-[1.38] font-normal px-4 py-3 rounded-[22px] rounded-br-[4px] max-w-[92%] shadow-sm">Hey ChatGPT, what's a quick way to remember Porter's Five Forces before my strategy exam?</div>
</article>
<!-- Assistant Message Row -->
<article class="flex flex-col items-start pr-4 space-y-4" data-purpose="assistant-message">
<!-- Assistant Response Body -->
<div class="text-[#f1f1f1] text-[16px] leading-[1.48] font-normal tracking-[-0.01em]"><span style="color: rgb(212, 212, 216); font-size: 14px; letter-spacing: normal;" class="">Try the acronym </span><span class="text-white font-medium" style="--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; --tw-text-opacity: 1; color: rgb(255, 255, 255); font-size: 14px; letter-spacing: normal;">'CRIST'</span><span style="color: rgb(212, 212, 216); font-size: 14px; letter-spacing: normal;" class=""> — Competitive rivalry, Rivalry... want me to make a mnemonic sentence instead?</span></div>
<!-- Utility Action Buttons Row (Copy, Thumbs Up, Thumbs Down, More) -->
<div class="flex items-center space-x-3.5 text-[#9a9a9f] pt-1" data-purpose="message-action-bar">
<!-- Copy Button -->
<button aria-label="Copy response" class="p-1 hover:text-white transition-colors active:scale-95" type="button">
<svg class="w-[18px] h-[18px] stroke-current stroke-[1.8] fill-none" viewBox="0 0 24 24">
<rect height="12" rx="2" stroke-linecap="round" stroke-linejoin="round" width="12" x="9" y="9"></rect>
<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Thumbs Up Button -->
<button aria-label="Good response" class="p-1 hover:text-white transition-colors active:scale-95" type="button">
<svg class="w-[18px] h-[18px] stroke-current stroke-[1.8] fill-none" viewBox="0 0 24 24">
<path d="M6.633 10.5c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 0 1 2.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 0 0 .322-1.672V3a.75.75 0 0 1 .75-.75 2.25 2.25 0 0 1 2.25 2.25c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 0 1-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 0 0-1.423-.23H5.25A2.25 2.25 0 0 1 3 15.75V12a2.25 2.25 0 0 1 2.25-2.25h1.383z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Thumbs Down Button -->
<button aria-label="Poor response" class="p-1 hover:text-white transition-colors active:scale-95" type="button">
<svg class="w-[18px] h-[18px] stroke-current stroke-[1.8] fill-none" viewBox="0 0 24 24">
<path d="M17.367 13.5c-.806 0-1.533.446-2.031 1.08a9.041 9.041 0 0 1-2.861 2.4c-.723.384-1.35.956-1.653 1.715a4.498 4.498 0 0 0-.322 1.672V21a.75.75 0 0 1-.75.75 2.25 2.25 0 0 1-2.25-2.25c0-1.152.26-2.243.723-3.218.266-.558-.107-1.282-.725-1.282H4.492c-1.026 0-1.945-.694-2.054-1.715A12.137 12.137 0 0 1 2.37 14.5c0-2.82 1.002-5.407 2.649-7.521.388-.482.987-.729 1.605-.729h5.896c.483 0 .964.078 1.423.23l3.114 1.04c.459.152.94.23 1.423.23h2.27A2.25 2.25 0 0 1 21 8.25V12a2.25 2.25 0 0 1-2.25 2.25h-1.383z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- More Options Horizontal Dots -->
<button aria-label="More message actions" class="p-1 hover:text-white transition-colors active:scale-95" type="button">
<svg class="w-[18px] h-[18px] fill-current" viewBox="0 0 24 24">
<circle cx="5" cy="12" r="1.8"></circle>
<circle cx="12" cy="12" r="1.8"></circle>
<circle cx="19" cy="12" r="1.8"></circle>
</svg>
</button>
</div>
<!-- Feedback Banner ("How was this conversation?") -->
<article class="flex justify-end pl-10 w-full pt-3 pb-1" data-purpose="user-message">
<div class="bg-[#0B477D] text-white text-[16px] leading-[1.38] font-normal px-4 py-3 rounded-[22px] rounded-br-[4px] max-w-[92%] shadow-sm">Yeah, do that</div>
</article><section class="w-full mt-3" data-purpose="conversation-feedback-banner"><div class="bg-[#212121] rounded-[20px] px-4 py-3.5 flex items-center justify-between text-white shadow-sm"><span class="text-[15px] font-normal text-[#E0E0E0] tracking-tight">How was this conversation?</span><div class="flex items-center space-x-3 text-[#cfcfd3]"><button aria-label="Rate conversation bad" id="feedback-thumbs-down" class="p-1.5 rounded-full hover:text-white hover:bg-white/10 transition-all duration-150 active:scale-90 cursor-pointer" type="button" onclick="const up = document.getElementById('feedback-thumbs-up'); const wasActive = this.classList.contains('bg-white/20'); this.classList.toggle('text-white', !wasActive); this.classList.toggle('bg-white/20', !wasActive); this.querySelector('svg').classList.toggle('fill-current', !wasActive); up.classList.remove('text-white', 'bg-white/20'); up.querySelector('svg').classList.remove('fill-current');"><svg class="w-5 h-5 stroke-current stroke-[1.8] fill-none transition-transform" viewBox="0 0 24 24"><path d="M17.367 13.5c-.806 0-1.533.446-2.031 1.08a9.041 9.041 0 0 1-2.861 2.4c-.723.384-1.35.956-1.653 1.715a4.498 4.498 0 0 0-.322 1.672V21a.75.75 0 0 1-.75.75 2.25 2.25 0 0 1-2.25-2.25c0-1.152.26-2.243.723-3.218.266-.558-.107-1.282-.725-1.282H4.492c-1.026 0-1.945-.694-2.054-1.715A12.137 12.137 0 0 1 2.37 14.5c0-2.82 1.002-5.407 2.649-7.521.388-.482.987-.729 1.605-.729h5.896c.483 0 .964.078 1.423.23l3.114 1.04c.459.152.94.23 1.423.23h2.27A2.25 2.25 0 0 1 21 8.25V12a2.25 2.25 0 0 1-2.25 2.25h-1.383z" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><button aria-label="Rate conversation good" id="feedback-thumbs-up" class="p-1.5 rounded-full hover:text-white hover:bg-white/10 transition-all duration-150 active:scale-90 cursor-pointer" type="button" onclick="const down = document.getElementById('feedback-thumbs-down'); const wasActive = this.classList.contains('bg-white/20'); this.classList.toggle('text-white', !wasActive); this.classList.toggle('bg-white/20', !wasActive); this.querySelector('svg').classList.toggle('fill-current', !wasActive); down.classList.remove('text-white', 'bg-white/20'); down.querySelector('svg').classList.remove('fill-current');"><svg class="w-5 h-5 stroke-current stroke-[1.8] fill-none transition-transform" viewBox="0 0 24 24"><path d="M6.633 10.5c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 0 1 2.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 0 0 .322-1.672V3a.75.75 0 0 1 .75-.75 2.25 2.25 0 0 1 2.25 2.25c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 0 1-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 0 0-1.423-.23H5.25A2.25 2.25 0 0 1 3 15.75V12a2.25 2.25 0 0 1 2.25-2.25h1.383z" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div></div></section>
</article>
</main>
<!-- END: ChatScrollStream -->
<!-- BEGIN: BottomPromptDock -->
<footer class="sticky bottom-0 pb-3 pt-1 bg-black/95 backdrop-blur-md" data-purpose="chat-input-controls">
<!-- Input Pill Container -->
<div class="h-14 bg-[#141414] border border-[#27272a]/60 rounded-full flex items-center px-2 pl-3.5 pr-1.5 shadow-lg">
<!-- Plus / Attachment Button -->
<button aria-label="Add attachment" class="w-8 h-8 flex items-center justify-center text-[#9c9ca3] hover:text-white transition-colors active:scale-95" type="button">
<svg class="w-5 h-5 stroke-current stroke-[2.2]" fill="none" viewBox="0 0 24 24">
<line stroke-linecap="round" x1="12" x2="12" y1="5" y2="19"></line>
<line stroke-linecap="round" x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
<!-- Placeholder / Input Field -->
<div class="flex-1 px-2.5 text-[16px] text-[#6b6b70] select-none cursor-text truncate font-normal">Talk to ChatGPT</div>
<!-- Dictation Microphone Button -->
<button aria-label="Voice dictation" class="w-9 h-9 flex items-center justify-center text-[#e5e5ea] hover:text-white mr-1 transition-colors active:scale-95" type="button">
<svg class="w-[22px] h-[22px] stroke-current stroke-[1.8] fill-none" viewBox="0 0 24 24">
<rect height="11" rx="3" stroke-linecap="round" width="6" x="9" y="3"></rect>
<path d="M19 10v1a7 7 0 0 1-14 0v-1" stroke-linecap="round"></path>
<line stroke-linecap="round" x1="12" x2="12" y1="18" y2="21"></line>
</svg>
</button>
<!-- ChatGPT Voice Mode Launcher Button (Vibrant Blue Waveform Circle) -->
<button aria-label="Start Voice Mode" class="w-10 h-10 rounded-full bg-[#007AFF] flex items-center justify-center text-white shadow-md active:scale-95 transition-all" type="button">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<!-- 4 Sound Wave Bars -->
<rect height="8" rx="1" width="2" x="5" y="8"></rect>
<rect height="15" rx="1" width="2" x="9.5" y="4.5"></rect>
<rect height="12" rx="1" width="2" x="14" y="6"></rect>
<rect height="6" rx="1" width="2" x="18.5" y="9"></rect>
</svg>
</button>
</div>
<!-- iOS Home Indicator Bar -->
<div class="w-full flex justify-center pt-3 pb-1" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-white/70 rounded-full"></div>
</div>
</footer>
<!-- END: BottomPromptDock -->
</div>
<!-- END: PhoneContainer -->






</body></html>
