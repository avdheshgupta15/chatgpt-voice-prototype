<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Choose your voice - ChatGPT</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appDark: '#0d0d0d',
            appPureBlack: '#000000',
            appSurface: '#212121',
            textMuted: '#9e9e9e',
            textSubtle: '#717171'
          }
        }
      }
    };
  </script>
<!-- Custom Orb Glow & Styles -->
<style data-purpose="custom-animations">
    @keyframes subtlePulse {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1) drop-shadow(0 0 28px rgba(110, 150, 255, 0.28));
      }
      50% {
        transform: scale(1.025);
        filter: brightness(1.08) drop-shadow(0 0 42px rgba(140, 175, 255, 0.42));
      }
    }
    .voice-orb {
      animation: subtlePulse 5s ease-in-out infinite;
      background: radial-gradient(circle at 50% 25%, #a8c2ff 0%, #7697ff 35%, #5672ea 65%, #3d4fad 100%);
    }
    .voice-orb-inner {
      background: radial-gradient(circle at 45% 30%, rgba(255,255,255,0.7) 0%, rgba(200,225,255,0.3) 28%, rgba(100,140,255,0) 70%);
    }
  </style>
</head>
<body class="bg-black text-white flex justify-center items-center min-h-screen font-sans antialiased select-none">
<!-- BEGIN: MobileContainer -->
<!-- Constrained to realistic iPhone viewport aspect ratio and dimensions -->
<main class="relative w-full max-w-[393px] h-[852px] max-h-screen bg-black flex flex-col justify-between overflow-hidden shadow-2xl">
<!-- BEGIN: TopBarSection -->
<header class="w-full pt-3 px-7 z-20 flex flex-col" data-purpose="screen-header">
<!-- iOS Status Bar Simulation -->
<div class="flex justify-between items-center text-white text-xs font-semibold tracking-tight pb-3"><div class="text-[15px] font-semibold tracking-tight text-white pl-1">7:07</div><div class="flex items-center space-x-1.5"><svg class="w-4 h-3 fill-current" viewBox="0 0 17 11"><rect height="3" rx="0.5" width="2.5" x="0" y="8"></rect><rect height="5.5" rx="0.5" width="2.5" x="4" y="5.5"></rect><rect height="8" rx="0.5" width="2.5" x="8" y="3"></rect><rect height="11" rx="0.5" width="2.5" x="12" y="0"></rect></svg><svg class="w-3.5 h-3 fill-current" viewBox="0 0 16 12"><path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-4.24-2.83a6.002 6.002 0 018.48 0 .75.75 0 001.06-1.06 7.502 7.502 0 00-10.6 0 .75.75 0 101.06 1.06zm-2.83-2.83a10.003 10.003 0 0114.14 0 .75.75 0 001.06-1.06 11.503 11.503 0 00-16.26 0 .75.75 0 001.06 1.06z"></path></svg><div class="w-6 h-3 border border-white/80 rounded-[3.5px] p-[1px] flex items-center relative"><div class="bg-white h-full w-4 rounded-[1.5px]"></div><div class="w-[1.5px] h-1.5 bg-white/80 absolute -right-[3px] rounded-r-sm"></div></div></div></div>
<!-- Navigation & Title Bar -->
<div class="relative flex items-center justify-between mt-3 py-1">
<!-- Invisible spacer for perfect title centering -->
<div class="w-10 h-10"></div>
<!-- Main Title -->
<h1 class="text-[20px] font-bold tracking-tight text-white text-center">
          Choose your voice
        </h1>
<!-- Close 'X' Button -->
<button aria-label="Close" class="w-9 h-9 rounded-full bg-[#1e1e1e] hover:bg-[#2c2c2c] active:scale-95 transition-all duration-150 flex items-center justify-center text-white/90" type="button">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- END: TopBarSection -->
<!-- BEGIN: VoiceAvatarSection -->
<section class="flex-1 flex flex-col items-center justify-center -mt-6 px-6" data-purpose="voice-visualizer">
<!-- Voice Animated Orb matching the reference image's soft sky-blue ethereal gradient -->
<div class="relative flex items-center justify-center">
<!-- Subtle outer aura glow layer -->
<div class="absolute w-64 h-64 rounded-full bg-blue-500/15 blur-2xl pointer-events-none"></div>
<!-- Main Circular Orb Visual -->
<div class="voice-orb relative w-[230px] h-[230px] rounded-full overflow-hidden shadow-2xl flex items-center justify-center">
<!-- Translucent soft light wash overlay -->
<div class="voice-orb-inner absolute inset-0 mix-blend-overlay"></div>
<!-- Additional mist layer -->
<div class="absolute inset-0 bg-gradient-to-t from-transparent via-white/10 to-white/40 opacity-70"></div>
</div>
</div>
<!-- Voice Info & Meta -->
<div class="mt-14 text-center">
<h2 class="text-3xl font-bold tracking-tight text-white mb-2">
          Ember
        </h2>
<p class="text-base text-[#929292] font-normal tracking-normal">
          Confident and optimistic
        </p>
</div>
<!-- Pagination Indicator Dots -->
<nav aria-label="Voice presets pagination" class="flex items-center justify-center space-x-2 mt-8">
<!-- Active Dot -->
<span class="w-1.5 h-1.5 rounded-full bg-white transition-all duration-200"></span>
<!-- Inactive Dots -->
<span class="w-1.5 h-1.5 rounded-full bg-[#3a3a3c] transition-all duration-200"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#3a3a3c] transition-all duration-200"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#3a3a3c] transition-all duration-200"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#3a3a3c] transition-all duration-200"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#3a3a3c] transition-all duration-200"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#3a3a3c] transition-all duration-200"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#3a3a3c] transition-all duration-200"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#3a3a3c] transition-all duration-200"></span>
</nav>
</section>
<!-- END: VoiceAvatarSection -->
<!-- BEGIN: FooterActionSection -->
<div class="w-full px-7 pb-2 pt-4 flex flex-col items-center gap-6 mt-auto z-20" data-purpose="footer-action">
  <button class="w-full py-4 bg-white text-black font-semibold text-lg rounded-full active:scale-[0.98] transition-transform duration-100 flex items-center justify-center" type="button">
    Continue
  </button>
  <div aria-hidden="true" class="w-36 h-1 bg-white rounded-full mb-1" data-purpose="home-indicator"></div>
</div>
<!-- END: FooterActionSection -->
</main>
<!-- END: MobileContainer -->






</body></html>
