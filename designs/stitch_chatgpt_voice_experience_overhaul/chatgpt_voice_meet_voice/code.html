<!DOCTYPE html><html class="h-full bg-black" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Meet Voice - ChatGPT</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              '-apple-system',
              'BlinkMacSystemFont',
              '"SF Pro Display"',
              '"SF Pro Text"',
              'Inter',
              'sans-serif'
            ],
          },
          colors: {
            darkBg: '#000000',
            cardBg: '#0c0c0e',
            subtext: '#a1a1aa',
          }
        }
      }
    }
  </script>
<style data-purpose="orb-styling">
    /* Ethereal fluid glowing orb recreating ChatGPT Voice mode */
    .voice-orb {
      width: 172px;
      height: 172px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #b8d0ff 25%, #8aaeff 55%, #6088fa 75%, #4167e8 100%);
      box-shadow: 
        0 0 50px rgba(96, 136, 250, 0.45),
        0 0 100px rgba(78, 118, 240, 0.25),
        inset 0 0 25px rgba(255, 255, 255, 0.7);
      position: relative;
      overflow: hidden;
      filter: blur(0.2px);
    }
    .voice-orb::before {
      content: "";
      position: absolute;
      top: -15%;
      left: -20%;
      width: 130%;
      height: 130%;
      background: radial-gradient(circle at 60% 40%, rgba(255, 255, 255, 0.75) 0%, rgba(186, 214, 255, 0.4) 30%, transparent 65%);
      filter: blur(8px);
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .voice-orb::after {
      content: "";
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 90%;
      height: 90%;
      background: radial-gradient(circle, rgba(93, 134, 246, 0.5) 0%, transparent 70%);
      filter: blur(12px);
      pointer-events: none;
    }
  </style>
<style data-purpose="safe-areas">
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 14px);
    }
  </style>
</head>
<body class="h-full bg-black text-white antialiased flex justify-center items-center select-none font-sans">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[393px] h-full sm:h-[852px] bg-black sm:rounded-[54px] overflow-hidden flex flex-col justify-between shadow-2xl border-0 sm:border sm:border-neutral-800" data-purpose="mobile-container">
<!-- Top Section (Status Bar & Controls) -->
<div class="w-full flex flex-col pt-safe px-7">
<!-- BEGIN: IOSStatusBar -->
<header class="w-full flex justify-between items-center text-white text-[15px] font-semibold tracking-tight pt-2 pb-1" data-purpose="status-bar">
<!-- Left: Time and App Switcher -->
<div class="flex items-center gap-1.5 cursor-pointer"><span class="text-[15px] font-semibold tracking-tight text-white">7:07</span></div>
<!-- Right: Cellular, WiFi, Battery -->
<div class="flex items-center space-x-2 text-white">
<!-- Cellular Signal -->
<svg class="w-[18px] h-[13px] fill-current" viewBox="0 0 17 12">
<rect height="3.5" rx="0.7" width="2.8" x="0" y="8.5"></rect>
<rect height="6.2" rx="0.7" width="2.8" x="4.4" y="5.8"></rect>
<rect height="9" rx="0.7" width="2.8" x="8.8" y="3"></rect>
<rect height="11.8" rx="0.7" width="2.8" x="13.2" y="0.2"></rect>
</svg>
<!-- Wi-Fi -->
<svg class="w-[17px] h-[13px] fill-current" viewBox="0 0 16 12">
<path d="M8 2.8C10.4 2.8 12.6 3.7 14.3 5.3L15.7 3.8C13.6 1.8 10.9 0.7 8 0.7C5.1 0.7 2.4 1.8 0.3 3.8L1.7 5.3C3.4 3.7 5.6 2.8 8 2.8ZM8 6.5C9.5 6.5 10.9 7.1 11.9 8.1L13.4 6.6C12 5.2 10.1 4.4 8 4.4C5.9 4.4 4 5.2 2.6 6.6L4.1 8.1C5.1 7.1 6.5 6.5 8 6.5ZM8 10.2C8.7 10.2 9.3 10.5 9.7 10.9L8 12.8L6.3 10.9C6.7 10.5 7.3 10.2 8 10.2Z"></path>
</svg>
<!-- Battery -->
<div class="w-[24px] h-[12px] border border-white/80 rounded-[3.5px] p-[1.5px] flex items-center relative">
<div class="h-full w-[85%] bg-white rounded-[1.5px]"></div>
<div class="w-[1.5px] h-[4px] bg-white/80 absolute -right-[3.5px] rounded-r-sm top-[3.5px]"></div>
</div>
</div>
</header>
<!-- END: IOSStatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="w-full flex justify-end items-center pt-3 pb-2" data-purpose="top-navigation">
<!-- Dismiss / Close Modal Button -->
<button aria-label="Close" class="w-9 h-9 rounded-full bg-[#1e1e20] hover:bg-[#2c2c2e] active:scale-95 transition-all duration-150 flex items-center justify-center text-[#d1d1d6]" type="button">
<svg class="w-5 h-5 stroke-current stroke-[2.25]" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
</nav>
<!-- END: NavigationBar -->
</div>
<!-- BEGIN: MainContent -->
<main class="w-full px-8 flex-1 flex flex-col items-center justify-center -mt-6" data-purpose="screen-content">
<!-- Central Ambient Orb Visual -->
<div class="mb-11 flex justify-center items-center" data-purpose="ambient-orb-container">
<div aria-label="Glowing periwinkle blue Voice orb" class="voice-orb" role="img"></div>
</div>
<!-- Main Headline Title -->
<h1 class="text-[34px] sm:text-[38px] font-bold tracking-tight text-white mb-10 text-center" data-purpose="title">
        Meet Voice
      </h1>
<!-- Features List Container -->
<div class="w-full space-y-7 max-w-[340px]" data-purpose="features-list">
<!-- Feature 1: Natural Conversation -->
<section class="flex items-start space-x-4" data-purpose="feature-item-audio">
<!-- Waveform Icon -->
<div aria-hidden="true" class="flex-shrink-0 pt-0.5 text-neutral-300">
<svg class="w-7 h-7 stroke-current stroke-[2.2]" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<line x1="12" x2="12" y1="2" y2="22"></line>
<line x1="17" x2="17" y1="5" y2="19"></line>
<line x1="7" x2="7" y1="7" y2="17"></line>
<line x1="22" x2="22" y1="10" y2="14"></line>
<line x1="2" x2="2" y1="10" y2="14"></line>
</svg>
</div>
<!-- Description -->
<p class="text-[17px] leading-[1.38] text-neutral-300 font-normal tracking-[-0.01em]">
            Say what's on your mind. ChatGPT listens, responds, and keeps the conversation flowing naturally.
          </p>
</section>
<!-- Feature 2: Data Persistence & Continuity -->
<section class="flex items-start space-x-4" data-purpose="feature-item-privacy">
<!-- Info Circle Icon -->
<div aria-hidden="true" class="flex-shrink-0 pt-0.5 text-neutral-300">
<svg class="w-7 h-7 stroke-current stroke-[2]" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<line x1="12" x2="12" y1="16" y2="12"></line>
<line x1="12" x2="12.01" y1="8" y2="8"></line>
</svg>
</div>
<!-- Description -->
<p class="text-[17px] leading-[1.38] text-neutral-300 font-normal tracking-[-0.01em]">
            Audio and video are saved to let you continue the conversation. <a class="text-white underline underline-offset-2 decoration-neutral-400 hover:text-neutral-200 transition-colors" href="#">Learn more</a>
</p>
</section>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: FooterCTA -->
<footer class="w-full px-7 pb-safe pt-2 flex flex-col items-center" data-purpose="footer-action">
<!-- Full-Width Primary Action Button -->
<button class="w-full h-[58px] bg-white text-black font-semibold text-[18px] rounded-full flex items-center justify-center shadow-lg active:scale-[0.985] active:bg-neutral-200 transition-all duration-150 tracking-[-0.01em]" type="button">
        Continue
      </button>
<!-- iOS Home Indicator -->
<div aria-hidden="true" class="mt-5 mb-1.5 w-36 h-1 rounded-full bg-white" data-purpose="home-indicator"></div>
</footer>
<!-- END: FooterCTA -->
</div>
<!-- END: MobileDeviceFrame -->




</body></html>
