<script>
  (() => {
    const orb = document.getElementById('voice-orb');
    const halo = document.getElementById('orb-halo');
    const micBtn = document.getElementById('mic-toggle');
    let isListening = true;

    if (orb && halo) {
      let phase = 0;
      setInterval(() => {
        phase += 0.05;
        const scale = 1 + Math.sin(phase) * 0.035;
        orb.style.transform = `scale(${scale})`;
      }, 50);
    }

    if (micBtn && orb) {
      micBtn.addEventListener('click', () => {
        isListening = !isListening;
        if (!isListening) {
          micBtn.classList.remove('bg-primary', 'text-on-primary');
          micBtn.classList.add('bg-surface-subtle', 'text-on-surface-muted');
          orb.style.filter = 'grayscale(0.4) brightness(0.85)';
        } else {
          micBtn.classList.add('bg-primary', 'text-on-primary');
          micBtn.classList.remove('bg-surface-subtle', 'text-on-surface-muted');
          orb.style.filter = 'none';
        }
      });
    }
  })();
